[versions]
mod = "0.2.0-SNAPSHOT.2"
java = "25"

# Minecraft
minecraft = "26.2"

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
neoforge = "26.2.0.59"
# https://projects.neoforged.net/neoforged/moddevgradle
moddevgradle = "2.0.143"
# https://projects.neoforged.net/neoforged/neoform
neoform = "26.2-2"

# Fabric
# Check versions at https://fabricmc.net/develop/
fabric-loader = "0.19.3"
fabric-api = "0.157.0+26.2"
fabric-loom = "1.17-SNAPSHOT"
fabric-modmenu = "20.0.1"

# SpongePowered Mixin
mixin = "0.8.7"
asm = "9.7"

# Third-party mods

# Modrinth API can't distinguish the same version with different Minecraft version.
# It always returns PAL 1.2.5+26.1 so we inevitably used unique identifiers.

player_animation_library = "Hq1CwB9w"
# player_animation_library = "1.2.6"

bendable_cuboids = "giI64d4E"
# bendable_cuboids = "2.0.3"

forgeconfigapiport = "26.2.1"

sodium = "mc1.21.1-0.6.13-neoforge"
iris = "1.8.12+1.21.1-neoforge"

# Helper Gradle-plugins
mcSafeResources = "0.0.2"
modPublish = "2.2.0"
mavenPublish = "0.37.0"

[libraries]

# Fabric
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-modmenu = { module = "com.terraformersmc:modmenu", version.ref = "fabric-modmenu" }

mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }

playerAnimationLibrary = { module = "maven.modrinth:player-animation-library", version.ref = "player_animation_library" }
bendableCuboids = { module = "maven.modrinth:bendable-cuboids", version.ref = "bendable_cuboids" }

forgeconfigapiport-common = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi", version.ref = "forgeconfigapiport" }
forgeconfigapiport-fabric = { module = "fuzs.forgeconfigapiport:forgeconfigapiport-fabric", version.ref = "forgeconfigapiport" }

# sodium = { module = "maven.modrinth:sodium", version.ref = "sodium" }
# iris = { module = "maven.modrinth:iris", version.ref = "iris" }

# Declared only in libraries[], not plugins[], as it's used only by Gradle convention plugins.
modPublish-gradle-plugin = { module = "me.modmuss50.mod-publish-plugin:me.modmuss50.mod-publish-plugin.gradle.plugin", version.ref = "modPublish" }
mavenPublish-gradle-plugin = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "mavenPublish" }

[plugins]
# Mod-loader plugins
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }

# Helper plugins
mcSafeResources = { id = "dev.echoellet.mc-safe-resources", version.ref = "mcSafeResources" }
